name: sira_projects
description: Sistem Informasi Riwayat Administrasi (SIRA) - Aplikasi manajemen laporan kerja notaris/PPAT.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # Firebase
  firebase_core: ^3.15.2
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  
  # State Management & Utils
  provider: ^6.1.2
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  internet_connection_checker_plus: ^2.1.0
  http: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true